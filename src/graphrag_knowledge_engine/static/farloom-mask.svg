<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" width="2400" height="1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="30%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#0f2b5c"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="glow1" cx="35%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#1e40af" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#172554" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chrome1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#60a5fa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="chrome2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="blur-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Deep Base Gradient -->
  <rect width="2400" height="1200" fill="url(#bg)"/>

  <!-- Specular Luminescent Light Clouds -->
  <ellipse cx="800" cy="450" rx="900" ry="500" fill="url(#glow1)"/>
  <ellipse cx="1650" cy="700" rx="850" ry="480" fill="url(#glow2)"/>

  <!-- Fluid Ribbon Waves / Liquid Mercury Filaments -->
  <path d="M-100,500 C400,250 800,850 1300,500 C1800,150 2100,750 2600,400 L2600,1300 L-100,1300 Z" fill="url(#chrome2)" opacity="0.75" filter="url(#blur-soft)"/>
  <path d="M-50,750 Q500,200 1200,600 T2500,450" fill="none" stroke="url(#chrome1)" stroke-width="140" opacity="0.85" filter="url(#blur-soft)"/>
  <path d="M0,350 Q600,850 1400,300 T2500,750" fill="none" stroke="#ffffff" stroke-width="60" opacity="0.7" filter="url(#blur-soft)"/>
  <path d="M100,600 C600,300 1100,900 1600,450 C2000,100 2300,650 2500,500" fill="none" stroke="#bae6fd" stroke-width="45" opacity="0.8"/>

  <!-- Specular Sharp Highlights -->
  <ellipse cx="650" cy="420" rx="350" ry="120" fill="#ffffff" opacity="0.65" transform="rotate(-15 650 420)" filter="url(#blur-soft)"/>
  <ellipse cx="1450" cy="550" rx="420" ry="140" fill="#ffffff" opacity="0.75" transform="rotate(18 1450 550)" filter="url(#blur-soft)"/>
  <ellipse cx="1950" cy="480" rx="280" ry="90" fill="#e0f2fe" opacity="0.6" transform="rotate(-8 1950 480)" filter="url(#blur-soft)"/>
</svg>
